<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="sidebar" class="col-md-3 col-lg-2 bg-dark min-vh-100 p-3 d-flex flex-column justify-content-between">
    <div>
        <!-- LOGO / TITULO -->
        <h4 class="text-white mb-3">
            <i class="bi bi-capsule me-2"></i> Farmacia
        </h4>

        <!-- TARJETA DEL USUARIO LOGUEADO EN EL SIDEBAR -->
        <div class="bg-secondary bg-opacity-25 rounded-3 p-2 mb-3 text-white">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-person-circle fs-3 text-info"></i>
                <div class="text-truncate">
                    <span class="d-block fw-bold small text-truncate" 
                          th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre : 'Invitado'}">
                        Usuario
                    </span>
                    <span class="badge bg-primary" style="font-size: 0.7rem;"
                          th:text="${session.usuarioLogueado != null and session.usuarioLogueado.rol != null ? session.usuarioLogueado.rol.nombre : 'Sin Rol'}">
                        Rol
                    </span>
                </div>
            </div>
        </div>

        <hr class="text-secondary my-3">

        <!-- MENÚ DE NAVEGACIÓN -->
        <ul class="nav nav-pills flex-column gap-2">
            <!-- Inicio: visible para todos -->
            <li class="nav-item">
                <a th:href="@{/inicio}" class="nav-link text-white">
                    <i class="bi bi-house me-2"></i> Inicio
                </a>
            </li>

            <!-- Categorías: solo Administrador (idRol == 1) -->
            <li class="nav-item" th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol.idRol == 1}">
                <a th:href="@{/categorias}" class="nav-link text-white">
                    <i class="bi bi-tags-fill me-2"></i> Categorías
                </a>
            </li>

            <!-- Productos: visible para todos -->
            <li class="nav-item">
                <a th:href="@{/productos}" class="nav-link text-white">
                    <i class="bi bi-box-seam me-2"></i> Productos
                </a>
            </li>

            <!-- Ventas: visible para todos -->
            <li class="nav-item">
                <a th:href="@{/ventas}" class="nav-link text-white">
                    <i class="bi bi-cart4 me-2"></i> Ventas
                </a>
            </li>

            <!-- Compras: solo Administrador (idRol == 1) -->
            <li class="nav-item" th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol.idRol == 1}">
                <a th:href="@{/compras}" class="nav-link text-white">
                    <i class="bi bi-cart-plus-fill me-2"></i> Compras
                </a>
            </li>

            <!-- Usuarios: solo Administrador (idRol == 1) -->
            <li class="nav-item" th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol.idRol == 1}">
                <a th:href="@{/usuarios}" class="nav-link text-white">
                    <i class="bi bi-people-fill me-2"></i> Usuarios
                </a>
            </li>

            <!-- Proveedores: solo Administrador (idRol == 1) -->
            <li class="nav-item" th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol.idRol == 1}">
                <a th:href="@{/proveedores}" class="nav-link text-white">
                    <i class="bi bi-truck me-2"></i> Proveedores
                </a>
            </li>
        </ul>
    </div>

    <!-- CERRAR SESIÓN -->
    <div>
        <hr class="text-secondary my-3">
        <ul class="nav nav-pills flex-column">
            <li class="nav-item">
                <a th:href="@{/loginController/logout}" class="nav-link text-danger">
                    <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
                </a>
            </li>
        </ul>
    </div>
</aside>

</body>
</html>
